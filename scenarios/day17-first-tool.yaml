name: "День 17 — первый инструмент MCP: курсы ЦБ"
description: |
  Один и тот же разговор о тратах в валюте в двух вариантах: без инструментов
  и с MCP-сервером «Курсы» — своим сервером стенда вокруг API ЦБ РФ.

  Курс модель знать не может: у неё дата обучения, а курс меняется каждый
  день. Вариант без инструментов вынужден либо отказаться, либо назвать
  курс по памяти. Вариант с MCP должен сам решить, что нужен инструмент,
  вызвать его с правильными аргументами и ответить по результату.

  Проверки — не на слова, а на поведение: вызван ли нужный инструмент,
  есть ли в ответе число из его результата, и не зовёт ли агент
  инструмент там, где он не нужен.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты ассистент по личным финансам. Отвечай по-русски, коротко и по делу.
    Суммы указывай с точностью до копеек.

variants:
  - name: без инструментов

  - name: MCP «Курсы»
    mcp: [rates]

dialog:
  - say: "Привет! Помоги разобраться с тратами в валюте."
    no_tools: true
    note: "Инструмент тут не нужен. Разница во входе между вариантами на этом ходе — цена схемы: её платят, даже когда ни один инструмент не вызван."

  - say: "В выписке Spotify списал 10 долларов. Сколько это в рублях по последнему курсу ЦБ?"
    tools: [rates.convert]
    uses_result: true
    note: "Главная проверка дня: агент сам выбирает инструмент, собирает аргументы и отвечает по результату."

  - say: "А какой был курс евро на 1 сентября 2026 года?"
    tools: [rates.exchange_rate]
    uses_result: true
    note: "Курс на дату — другой инструмент и другой аргумент. 1 сентября — вторник, курс ЦБ на эту дату есть."

  - say: "Я еду в Стамбул с бюджетом 30 000 рублей. Сколько это в лирах?"
    tools: [rates.convert]
    uses_result: true
    note: "Обратное направление: из рублей в лиры. Модели нужно понять, что from — RUB, а to — TRY."

  - say: "А курс на 31 сентября?"
    note: "Красный путь: такой даты нет. Инструмент вернёт ошибку результатом, и модель должна её пересказать, а не выдумать курс."

  - say: "Спасибо, всё понятно."
    no_tools: true
