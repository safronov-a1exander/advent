name: "День 19 — композиция MCP-инструментов: поиск → сводка → отчёт"
description: |
  Один MCP-сервер «Бюджет» и три инструмента: search_transactions получает
  данные, summarize_transactions обрабатывает, save_report сохраняет.
  Цепочку строит модель: получила результат одного инструмента и сама
  сформулировала вызов следующего.

  Два варианта отличаются только тем, как данные идут от поиска к сводке.
  «По ссылке» — поиск отдаёт dataset_id, сводка берёт операции на сервере.
  «По значению» — поиск отдаёт операции целиком, и модель переписывает их
  в аргументы сводки сама. Сервер сверяет всё, что к нему пришло, со своей
  выдачей и пишет итог сверки в результат — так «корректность передачи
  данных между инструментами» проверяется кодом, а не глазами.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты ассистент по личным финансам. Отвечай по-русски, коротко и по делу.
    Суммы бери только из инструментов, в уме не пересчитывай.

variants:
  - name: по ссылке
    mcp: [budget]

  - name: по значению
    mcp: [budget-byvalue]

dialog:
  - say: "Найди все мои траты на кафе в сентябре 2026, посчитай итог с учётом возвратов и сохрани отчёт в файл."
    tools: [search_transactions, summarize_transactions, save_report]
    tool_expect:
      summarize_transactions: "без расхождений"
      save_report: "в отчёте есть"
    expect: ["1390"]
    note: "Вся цепочка одним вопросом. Итог: 390 + 1480 − 480 возврат = 1390. Проверяется и порядок вызовов, и что данные дошли без искажений на обоих стыках."

  - say: "Теперь то же самое по покупкам за сентябрь, и тоже сохрани отчёт."
    tools: [search_transactions, summarize_transactions, save_report]
    tool_expect:
      summarize_transactions: "без расхождений"
      save_report: "в отчёте есть"
    expect: ["2350"]
    note: "Ловушка с датой: покупка OZON 31 августа в сентябрь не входит. Wildberries 4150 − возврат 1800 = 2350."

  - say: "А сколько всего я потратил по всей выписке в рублях, если не считать переводы себе на накопительный счёт и снятие наличных? Отчёт не нужен."
    tools: [search_transactions, summarize_transactions]
    tool_expect:
      summarize_transactions: "без расхождений"
    expect: ["17225"]
    note: "Длинная выдача — пятнадцать операций. По значению модели нужно переписать их все без ошибок. Итог по выписке 32225, минус перевод 10000 и наличные 5000 — 17225; 10 долларов Spotify в рубли не входят."
