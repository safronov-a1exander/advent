name: "День 11 — модель памяти: что переживает разговор"
description: |
  Один и тот же сбор ТЗ в трёх вариантах памяти. Первые девять реплик
  заказчик рассказывает про себя и про задачу, две проверки идут внутри
  разговора — их проходят все, потому что история ещё цела.

  Дальше команда `newchat`: разговор оборван и начат новый тем же агентом.
  Это и есть вопрос дня. История и краткосрочный слой уходят у всех,
  а рабочий (задача) и долговременный (пользователь) слои — только у того,
  у кого их нет. Три проверки после обрыва показывают разницу, последняя
  реплика просит собрать ТЗ заново.

  Третий вариант нарочно взят с sliding window и хвостом 2: слои памяти —
  не стратегия контекста, они работают поверх любой. Модель почти не видит
  истории, но задачу помнит.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты бизнес-аналитик и помогаешь собрать техническое задание.
    Отвечай по-русски, по делу и кратко: три-пять предложений или короткий список.
    Опирайся только на то, что сказал заказчик; чего не знаешь — так и говори.
    Суммы — в рублях без разделителей разрядов.

variants:
  - name: без слоёв
    context: ""
    # Память — только история разговора, как на десятом дне. Новый разговор
    # начинается с чистого листа и во всех смыслах.

  - name: слои, раскладка агентом
    context: ""
    memory: auto
    user: олег
    task: бот барбершопа

  - name: слои + окно 2
    context: window
    keep_last: 2
    memory: auto
    user: олег
    task: бот барбершопа

dialog:
  - say: "Меня зовут Олег, у меня две точки барбершопа «Бритва» в Казани. Нужен Telegram-бот для записи."
  - say: "Сразу скажу про себя: я сам разработчик, пишу на Go, объяснять базовые вещи не надо. Отвечай технически."
  - say: "Бюджет 150000 рублей, запуск к 1 ноября. Бэкенд только на Go, база PostgreSQL."
  - say: "Слоты берём из Google Calendar мастеров. Напоминание за 2 часа до визита обязательно."
  - say: "Отмена записи — не позднее чем за 3 часа, иначе клиент платит 500 рублей штрафа при следующей записи."
  - say: "Оплата на первом этапе не нужна, только бронь. Мастеров сейчас семеро."

  - say: "Напомни, какой у нас бюджет и к какой дате запуск?"
    expect: ["150000", "1 ноября"]
    note: "Проверка внутри разговора: история цела, это должны пройти все."

  - say: "И на каком стеке договорились?"
    expect: ["Go", "PostgreSQL"]
    note: "Тоже внутри разговора. Заодно видно, что вариант с окном 2 уже начинает терять раннее."

  - say: "Хорошо, продолжим завтра."

  - newchat: "заказчик вернулся на следующий день"

  - say: "Привет, это снова я. Какой у нас бюджет и срок?"
    expect: ["150000", "1 ноября"]
    note: "Главная проверка дня. История стёрта у всех. Рабочая память задачи — только у вариантов со слоями."

  - say: "Какие правила отмены мы приняли?"
    expect: ["3 час", "500"]
    note: "То же про договорённости: они шли одной репликой в середине стёртого разговора."

  - say: "Ты помнишь, кто я и как со мной разговаривать?"
    expect: ["Олег", "Go"]
    note: "Долговременный слой: имя и то, что заказчик сам разработчик. Это про пользователя, а не про задачу."

  - say: "Собери итоговое ТЗ одним списком: бюджет, срок, стек, источник слотов, напоминания, правила отмены, оплата, число мастеров."
    expect: ["150000", "1 ноября", "Go", "Google Calendar", "2 час", "3 час", "500", "сем"]
    note: "Итог после обрыва разговора: сколько деталей вообще дожило."
