name: day04-temperature-creative
title: идеи по экономии
description: >-
  Творческая часть того же ассистента: просим идеи, как сократить траты.
  Каждая настройка прогоняется трижды, чтобы «разнообразие» стало числом:
  колонка СХОДСТВО — среднее попарное сходство ответов между прогонами.
  Последний вариант намеренно выходит за границу диапазона, чтобы показать,
  что делает API.

repeat: 3

system: Ты ассистент по личным финансам. Отвечай по-русски, кратко.

params:
  max_tokens: 500
  # Рассуждения отключены: с ними ответ при temperature=0 перестаёт быть
  # воспроизводимым (reasoning каждый раз свой), и колонка СХОДСТВО
  # показывает ерунду. День про сэмплирование, а не про режим инференса.
  thinking: disabled

vars:
  brief: |
    За месяц я потратил 1480 ₽ на доставку еды, 390 ₽ на кофе навынос
    и 3500 ₽ на абонемент в спортзал, которым почти не пользуюсь.
    Придумай три необычных способа сократить эти траты.
    Формат ответа ровно три строки, каждая начинается с «— ».

variants:
  - id: t0
    label: "temperature = 0"
    note: >-
      Жадное декодирование: на каждом шаге берётся самый вероятный токен.
      Сходство здесь максимальное из всей шкалы, но до 1.00 не дотягивает:
      на замере получилось 0.38. Полного детерминизма на распределённом
      инференсе не бывает — важен не абсолютный ноль разброса, а то, что
      при росте температуры сходство падает дальше, до нуля.
    params:
      temperature: 0
    steps:
      - user: "{{.brief}}"

  - id: t07
    label: "temperature = 0.7"
    note: >-
      Рабочий компромисс. Варианты разные, но остаются осмысленными
      и держат заданный формат.
    params:
      temperature: 0.7
    steps:
      - user: "{{.brief}}"

  - id: t12
    label: "temperature = 1.2"
    note: >-
      Выше дефолта DeepSeek (1.0). Идеи заметно смелее, но начинает плыть
      формат: модель добавляет пояснения, забывает про три строки.
    params:
      temperature: 1.2
    steps:
      - user: "{{.brief}}"

  - id: t20
    label: "temperature = 2.0 (потолок)"
    note: >-
      Максимум, который принимает DeepSeek. Связность заметно падает —
      удобная иллюстрация того, что температура не «уровень креативности»,
      а ширина распределения, из которого сэмплируется следующий токен.
    params:
      temperature: 2.0
    steps:
      - user: "{{.brief}}"

  - id: t25
    label: "temperature = 2.5 (за границей)"
    note: >-
      Заведомо невалидное значение. Показываем, что API не обрезает молча,
      а отвечает 400. Проверка ждёт именно ошибку, поэтому красным этот
      вариант не считается.
    params:
      temperature: 2.5
    checks:
      expect_error: "temperature"
    steps:
      - user: "{{.brief}}"
