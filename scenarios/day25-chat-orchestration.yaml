name: "День 25 — мини-чат с RAG и памятью задачи: повторить замер дня 20"
description: |
  Длинный разговор, двенадцать реплик. Пользователь в первой реплике
  называет цель (повторить у себя сравнение дня 20, понять, что
  запускать и во сколько обойдётся) и ограничение (только
  deepseek-flash, других платных ключей нет), а дальше задаёт вопросы
  по базе знаний — и дважды проверяет, не потерял ли ассистент цель.

  Оба варианта — production-like мини-чат: поиск с реранком и порогом,
  rewrite с историей, ответы с источниками и проверенными цитатами,
  контекст — окно из четырёх последних сообщений (длинный чат не тащит
  всю историю). Разница одна: у второго — память задачи (день 11):
  служебный вызов после каждой реплики раскладывает цель, уточнения,
  ограничения и термины по слоям, и рабочий слой уходит в каждый запрос
  и в rewrite.

  К восьмой реплике первая уже выпала из окна. Вариант без памяти цель
  и ограничение может знать только из неё — то есть уже не знает.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  context: window
  keep_last: 4
  rag: "on"
  rag_candidates: 10
  rag_rerank: true
  rag_min_rerank: 0.1
  rag_rewrite: true
  rag_cite: true
  rag_expand: true
  system: |
    Ты ассистент учебного стенда advent — проекта на Go для экспериментов
    с LLM по REST API, который ведётся по дням курса. Помогаешь
    пользователю довести его задачу до конца. Отвечай по-русски, коротко:
    два-четыре предложения, с числами, если они есть.

variants:
  - name: окно 4

  - name: окно 4 + память задачи
    memory: auto
    task: kb-25-day20

dialog:
  - say: "Хочу повторить у себя сравнение из двадцатого дня: три своих MCP-сервера против варианта с лишними. Цель — понять, что запускать и во сколько это обойдётся. Ограничение: модель только deepseek-flash, других платных ключей у меня нет. Какие свои серверы там участвуют?"
    expect: ["rates", "budget", "goals"]
    sources: [docs/days/day20.md]
    cited: true
    note: "Цель и ограничение названы здесь и больше не повторяются."

  - say: "Какие два чужих сервера добавляли во втором варианте?"
    expect: ["deepwiki", "context7"]
    sources: [docs/days/day20.md]
    cited: true

  - say: "Какой командой запускается само сравнение?"
    expect: ["day20-orchestration"]
    cited: true

  - say: "Сколько стоил один прогон варианта с тремя серверами?"
    expect: ["0.0009"]
    sources: [docs/days/day20.md]
    cited: true

  - say: "А почему лишние серверы почти ничего не добавили в деньгах?"
    expect: ["кэш"]
    sources: [docs/days/day20.md]
    cited: true
    note: "«Лишние серверы» — отсылка к прошлым репликам: rewrite раскрывает её через историю и память."

  - say: "Нужен ли этим чужим серверам ключ?"
    grounded: true
    note: "Ответ в базе есть (день 16: «три публичных сервера без ключа»), но может и не найтись. Честны оба исхода: ответ по цитатам или «не знаю»."

  - say: "Сколько входных токенов было у варианта с лишними серверами?"
    expect: ["47"]
    sources: [docs/days/day20.md]
    cited: true

  - say: "Напомни, какая у меня цель и какое ограничение я назвал?"
    expect: ["deepseek-flash"]
    no_sources: true
    note: "Главная проверка. Первая реплика уже вне окна: цель и ограничение остались только в памяти задачи. Искать в базе тут нечего — ответ из разговора."

  - say: "Где взять файл с ключом, чтобы всё это запустить?"
    expect: [".env"]
    cited: true

  - say: "С учётом моего ограничения: какие серверы мне вообще не понадобятся, если повторять только вариант с тремя своими?"
    expect: ["deepwiki", "context7"]
    grounded: true
    note: "Нужны и цель с ограничением (память), и состав вариантов (база)."

  - say: "Сколько вызовов инструментов делал агент на длинном флоу?"
    grounded: true

  - say: "Подведи итог под мою цель и ограничение: что запускать и во сколько обойдётся."
    expect: ["deepseek-flash"]
    note: "Итог должен держаться за цель (что запускать, сколько стоит) и ограничение (deepseek-flash), названные одиннадцать реплик назад. Чисел не требуем: итог — вопрос о разговоре, в базе по нему не ищут, а ответ с ценой уже вне окна."
