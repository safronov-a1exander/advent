# День 9 — сжатие истории через summary.
#
#   go run ./cmd/advent dialog -scenario scenarios/day09-compression.yaml
#
# Один и тот же разговор проходят три агента: с полной историей, со сжатием
# часто и со сжатием редко. Факты и договорённости звучат в первых репликах,
# потом идёт разговор с развёрнутыми ответами — история растёт и сжимается
# несколько раз, — а в конце вопросы на память о деталях из начала.
# Проверки ищут в ответе конкретные числа и слова: сводка, которая
# «примерно помнит», их не пройдёт.
#
# Первая версия сценария просила краткие ответы: разговор дорастал до
# 1400 токенов, и на такой длине сжатию негде выиграть. Ответы развёрнутые,
# чтобы было видно и цену сжатия, и то, что оно даёт окну.

name: day09 — сжатие истории
description: >-
  Полная история против summary на одном разговоре о бюджете: 16 реплик,
  пять из них — проверки на память о деталях, названных в самом начале.

defaults:
  tier: weak
  system: >-
    Ты ассистент по личным финансам. Отвечай по-русски, развёрнуто и
    по делу: пять-восемь предложений с конкретными шагами и примерами.
    Суммы — в рублях без разделителей разрядов.
  temperature: 0
  thinking: disabled
  max_tokens: 700

variants:
  - name: полная история

  - name: summary часто
    context: summary
    keep_last: 4        # два последних хода идут как есть
    summarize_every: 6  # сжимать, когда за хвостом накопилось шесть сообщений

  - name: summary редко
    context: summary
    keep_last: 6         # три последних хода как есть
    summarize_every: 12  # сжимать реже — меньше служебных вызовов и сбросов кэша

dialog:
  # --- факты и договорённости ---
  - say: Привет! Меня зовут Саша. Бюджет на сентябрь 60000 рублей, уже потрачено 38865.
  - say: Цель на месяц — отложить 10000 рублей. Абонемент в спортзал за 3500 не трогаем ни при каких условиях.
  - say: Договоримся о лимите на кафе и доставку еды — 3000 рублей в месяц, и не больше 700 за один заказ.
  - say: Подписку Spotify за 10 долларов отменяю с 1 октября, считай доллар по 90.

  # --- разговор с развёрнутыми ответами: история растёт ---
  - say: Как вообще лучше вести учёт трат — в приложении банка или в таблице?
  - say: Какие категории трат обычно съедают больше всего у людей с таким бюджетом?
  - say: Посоветуй три простых привычки, чтобы меньше тратить на маркетплейсах.
  - say: Стоит ли переводить сбережения на накопительный счёт или лучше вклад?
  - say: Как не сорваться в конце месяца, когда деньги почти кончились?
  - say: Что делать, если друзья зовут в ресторан, а лимит на кафе уже почти выбран?
  - say: Как объяснить семье, почему я режу расходы?

  # --- проверки на память о начале разговора ---
  - say: Напомни, как меня зовут и сколько у меня осталось до конца месяца?
    expect: ["Саша", "21135"]
    note: имя и остаток — первая реплика
  - say: Если из этого остатка отложить цель по накоплениям, сколько останется? Спортзал пока не вычитай.
    expect: ["11135"]
    note: нужны остаток и цель — две разные ранние реплики
  - say: Что мы договорились не трогать при экономии?
    expect: ["спорт"]
    note: ограничение из второй реплики
  - say: Какой у меня лимит на кафе и доставку и какое ограничение на один заказ?
    expect: ["3000", "700"]
    note: две цифры одной договорённости — вторую сводки теряют чаще
  - say: С какого числа я отменяю Spotify и сколько это экономит в рублях в месяц?
    expect: ["1 октября", "900"]
    note: дата и пересчёт по курсу из четвёртой реплики
