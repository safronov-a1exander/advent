name: day05-models
title: выбор модели под задачу
description: >-
  Один и тот же рабочий запрос ассистента — расчёт остатка бюджета по
  выписке — на моделях разного класса. Меряем время ответа, токены,
  стоимость и скорость генерации (ток/с), а качество проверяем объективно:
  у задачи один верный ответ (38865).

repeat: 2

system: >-
  Ты ассистент по личным финансам. Сначала кратко покажи вычисления,
  последней строкой выведи ровно «ОТВЕТ: <число>» — без пробелов,
  разделителей разрядов и знака рубля.

params:
  temperature: 0
  max_tokens: 2000

vars_files:
  statement: data/statement.txt

vars:
  task: |
    Бюджет на месяц — 60000 рублей. Сколько от него осталось?

    Правила подсчёта:
    — считаем только операции сентября;
    — перевод на собственный накопительный счёт тратой не считается;
    — снятие наличных считается тратой;
    — возвраты (отрицательные суммы) уменьшают траты;
    — операции в долларах пересчитываются по курсу 90 рублей за доллар.

checks:
  must_contain: ["38865"]

# Модели указаны в каждом варианте. Имена должны совпадать с тем, что
# отдаёт `advent models` — сверься перед прогоном.
variants:
  - id: weak
    label: "слабая — flash без рассуждений"
    model: deepseek-v4-flash
    note: >-
      Дешёвый быстрый режим: рассуждения отключены параметром thinking,
      модель отвечает «в лоб». Ожидаемо самая быстрая и самая дешёвая.
    params:
      thinking: disabled
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}

  - id: medium
    label: "средняя — flash с рассуждениями"
    model: deepseek-v4-flash
    note: >-
      Та же модель, но с включёнными рассуждениями. Хороший контроль:
      видно, что даёт не размер модели, а режим инференса. Reasoning-токены
      видны отдельной колонкой и оплачиваются как output.
    params:
      thinking: enabled
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}

  - id: strong
    label: "сильная — pro с рассуждениями"
    model: deepseek-v4-pro
    note: >-
      Старшая модель. Смотрим, окупается ли разница в цене за output
      на разборе выписки — если нет, ассистенту она в этой роли не нужна,
      и это тоже вывод.
    params:
      thinking: enabled
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}
