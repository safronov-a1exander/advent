name: day04-temperature-precise
title: расчёт остатка бюджета
description: >-
  Та же шкала температур, но расчёт остатка бюджета — задача с единственным
  верным ответом (38865). Здесь важна не оригинальность, а попадание:
  колонка УСПЕХ показывает, сколько прогонов из трёх дали правильное число.
  Вместе с творческим сценарием это и есть ответ на вопрос «какая настройка
  для чего».

repeat: 3

system: >-
  Ты ассистент по личным финансам. Последней строкой выведи ровно
  «ОТВЕТ: <число>» — без пробелов, разделителей разрядов и знака рубля.

params:
  max_tokens: 1500
  # Рассуждения отключены: иначе весь max_tokens уходит в reasoning-токены,
  # и до ответа генерация не доходит. Проверено на живом API.
  thinking: disabled

vars_files:
  statement: data/statement.txt

vars:
  task: |
    Бюджет на месяц — 60000 рублей. Сколько от него осталось?

    Правила подсчёта:
    — считаем только операции сентября;
    — перевод на собственный накопительный счёт тратой не считается;
    — снятие наличных считается тратой;
    — возвраты (отрицательные суммы) уменьшают траты;
    — операции в долларах пересчитываются по курсу 90 рублей за доллар.

checks:
  must_contain: ["38865"]

variants:
  - id: t0
    label: "temperature = 0"
    note: Для расчётов это настройка по умолчанию — нужен один и тот же ответ.
    params:
      temperature: 0
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}

  - id: t07
    label: "temperature = 0.7"
    note: Разброс уже заметен, но на простых расчётах обычно не мешает.
    params:
      temperature: 0.7
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}

  - id: t12
    label: "temperature = 1.2"
    note: >-
      Здесь начинается цена «креативности»: модель может свернуть не туда
      на середине выписки, и ответ окажется другим при каждом прогоне.
    params:
      temperature: 1.2
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}

  - id: t20
    label: "temperature = 2.0"
    note: Потолок диапазона. На расчёте бюджета — худший из возможных выборов.
    params:
      temperature: 2.0
    steps:
      - user: |
          {{.task}}

          Выписка:
          {{.statement}}
