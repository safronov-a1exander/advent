name: day29-tuning
title: локальная модель под задачу
description: >-
  Расчёт остатка бюджета по выписке (дни 3–5) на Qwen3-4B в llama.cpp:
  до оптимизации и после — параметры, шаблон промпта, квантовка и окно
  контекста. Верный ответ один — 38865, проверка кодом.
  Нужен llama-server в режиме роутера: scripts/local-llm.ps1 -Router.

provider: local
repeat: 3

# «До» — как в дне 26: общий промпт, параметры сервера по умолчанию.
system: >-
  Ты ассистент по личным финансам. Сначала кратко покажи вычисления,
  последней строкой выведи ровно «ОТВЕТ: <число>» — без пробелов,
  разделителей разрядов и знака рубля.

vars_files:
  statement: data/statement.txt

vars:
  task: |
    Бюджет на месяц — 60000 рублей. Сколько от него осталось в сентябре?

    Правила подсчёта:
    — считаем только операции сентября;
    — перевод на собственный накопительный счёт тратой не считается;
    — снятие наличных считается тратой;
    — возвраты (отрицательные суммы) уменьшают траты;
    — операции в долларах пересчитываются по курсу 90 рублей за доллар.
  # Шаблон под задачу. Маленькая модель не держит в голове пять правил
  # и пятнадцать чисел сразу — шаблон раскладывает работу на шаги, каждый
  # из которых ей по силам: классифицировать одну строку, прибавить одно
  # число. Пример — на другой выписке, чтобы модель не списала ответ.
  template: |
    Ты считаешь остаток бюджета по банковской выписке. Отвечай строго по шаблону, без вступлений.

    ШАГ 1. Разбери КАЖДУЮ операцию выписки отдельной строкой:
    <дата> <получатель> | месяц: <ММ> | вид: покупка/возврат/перевод себе/наличные | <сумма в рублях> | в счёт: да/нет
    Правила «в счёт»: месяц не тот, о котором спрашивают → нет; перевод себе → нет; всё остальное → да.
    Сумму в валюте умножь на курс из задачи прямо в строке: <N> USD × <курс> = <рубли>.

    ШАГ 2. Выпиши ТОЛЬКО операции с «в счёт: да» и складывай по одной:
    0 + <сумма> = <итог>, затем <итог> + <сумма> = <итог> и так далее. Возврат — это прибавление отрицательного числа.

    ШАГ 3. <бюджет> − <итог> = <остаток>
    ОТВЕТ: <остаток>

    Пример на другой выписке: бюджет 20000, считаем август, курс 90.
    25.07 LAVKA 500.00 RUB | месяц: 07 | вид: покупка | 500 | в счёт: нет
    02.08 KOFE 300.00 RUB | месяц: 08 | вид: покупка | 300 | в счёт: да
    03.08 KOFE REFUND -100.00 RUB | месяц: 08 | вид: возврат | -100 | в счёт: да
    04.08 TRANSFER TO OWN SAVINGS ACC 5000.00 RUB | месяц: 08 | вид: перевод себе | 5000 | в счёт: нет
    05.08 ATM CASH WITHDRAWAL 2000.00 RUB | месяц: 08 | вид: наличные | 2000 | в счёт: да
    06.08 NETFLIX 5.00 USD | месяц: 08 | вид: покупка | 5 USD × 90 = 450 | в счёт: да
    0 + 300 = 300; 300 + (-100) = 200; 200 + 2000 = 2200; 2200 + 450 = 2650
    20000 − 2650 = 17350
    ОТВЕТ: 17350

checks:
  must_contain: ["ОТВЕТ: 38865"]

variants:
  - id: before
    label: "до: общий промпт, параметры сервера по умолчанию"
    model: qwen3-4b
    note: >-
      Как в дне 26. Qwen3 по умолчанию рассуждает, temperature сервера —
      0.8, max_tokens не задан. Ответ бывает верным, но ценой тысяч
      токенов рассуждений, и от прогона к прогону разный.
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}

  - id: params
    label: "только параметры: t=0, без рассуждений, max_tokens 1200"
    model: qwen3-4b
    note: >-
      Очевидная оптимизация скорости: выключить рассуждения, зафиксировать
      температуру, ограничить длину. Быстро и стабильно — и стабильно
      неверно: модель складывает всё подряд, правила теряются.
    params: {temperature: 0, thinking: disabled, max_tokens: 1200}
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}

  - id: template
    label: "шаблон под задачу: разбор по строкам + пример"
    model: qwen3-4b
    system: "{{.template}}"
    note: >-
      Те же параметры, другой промпт. Рассуждение вынесено в ответ, но
      в жёсткой форме: строка на операцию, решение по правилу, сумма
      накопительным итогом. Токенов вдвое меньше, чем у рассуждений.
    params: {temperature: 0, thinking: disabled, max_tokens: 1200}
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}

  - id: template-c4k
    label: "шаблон + окно 4096 и KV-кэш в 8 бит"
    model: qwen3-4b-c4k
    system: "{{.template}}"
    note: >-
      Задаче нужно ~2000 токенов окна, а сервер держал 8192. Окно 4096
      и KV-кэш q8_0 — меньше видеопамяти при том же ответе.
    params: {temperature: 0, thinking: disabled, max_tokens: 1200}
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}

  - id: template-q8
    label: "шаблон + квантовка Q8_0 вместо Q4_K_M"
    model: qwen3-4b-q8
    system: "{{.template}}"
    note: >-
      Те же веса в 8 бит, на 1.8 ГБ тяжелее. Если шаблон уже дал верный
      ответ, лишняя точность весов не нужна — а платим за неё скоростью.
    params: {temperature: 0, thinking: disabled, max_tokens: 1200}
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}

  - id: template-c1536
    label: "шаблон + окно 1536 — меньше задачи"
    model: qwen3-4b-c1536
    system: "{{.template}}"
    note: >-
      Промпт (~1200 токенов) влезает, ответ — нет: генерация упирается
      в окно и обрывается до строки ОТВЕТ. Экономить окно можно, пока
      в него помещаются промпт и ответ вместе.
    params: {temperature: 0, thinking: disabled, max_tokens: 1200}
    steps:
      - user: |
          {{.task}}
          Выписка:
          {{.statement}}
