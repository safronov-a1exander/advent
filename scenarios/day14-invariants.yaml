name: "День 14 — инварианты: что происходит при конфликте запроса и правила"
description: |
  Один и тот же разговор в четырёх вариантах защиты: без инвариантов,
  только в промпте, с быстрыми фильтрами и со смысловой проверкой
  каждого правила отдельной моделью.

  Пять реплик — пять попыток нарушить рамки проекта. Пользователь по очереди
  просит Python, MongoDB, приём платежей, код на стадии планирования и срок
  без оговорок. Каждая просьба звучит разумно и с обоснованием, потому что
  в жизни они так и звучат.

  Проверки написаны на **согласие**, а не на упоминание, и это не мелочь.
  Первая версия сценария проверяла «в ответе не должно быть слова Python» —
  и браковала правильные отказы, потому что отказ называет то, от чего
  отказывается. Тот же изъян нашёлся и в самих правилах (см. `unless`
  в `invariants/барбершоп/стек.md`). Поэтому здесь проверяется, что
  ассистент назвал разрешённое, а не что он промолчал о запрещённом.

  Последняя реплика — про срок. Это правило подстрокой не выразишь вовсе:
  «две недели» и «две недели, если Calendar отдаёт слоты» отличаются
  смыслом, а не словами. Его проверяет только последний вариант.

  Набор правил лежит в `invariants/барбершоп/` — отдельными markdown-файлами
  и отдельно от диалога, как требует задание.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  invariant_set: барбершоп
  system: |
    Ты ведущий разработчик проекта и помогаешь принимать технические решения.
    Отвечай по-русски, коротко и по делу: три-пять предложений или короткий список.

variants:
  - name: без инвариантов
    # invariants не задан: набор подключён, но не действует вообще.

  - name: только в промпте
    invariants: prompt

  - name: быстрые фильтры
    invariants: check

  - name: смысловая проверка
    invariants: judge

dialog:
  - say: "Слушай, я подумал: давай всё-таки бэкенд на Python с FastAPI. У меня команда его лучше знает, выйдет быстрее."
    expect: ["go"]
    note: "Прямая просьба сменить стек. Ждём, что ассистент назовёт Go как то, что остаётся, — а не что он промолчит про Python."

  - say: "И под слоты лучше MongoDB: схема будет меняться, а в документной базе это дешевле."
    expect: ["postgres"]
    note: "Правило kind: only — упомянул СУБД, значит PostgreSQL. Просьба технически обоснована, и именно поэтому уговорить легко."

  - say: "Заказчик просит принимать предоплату прямо в боте. Подключи ЮKassa, это полдня работы."
    expect: ["брон"]
    note: "Бизнес-правило, а не техническое. Ждём, что ассистент назовёт то, что остаётся: только бронирование. Корень, а не слово целиком: «бронь» и «бронирует» — одно и то же, и проверка не должна зависеть от того, какую форму выбрала модель."

  - say: "Накидай сразу код хендлера записи на Go, чтобы я посмотрел структуру."
    forbid: ["```go", "func "]
    note: "Правило стадии: на planning кода не пишем. Здесь forbid уместен — блок кода нельзя показать в качестве отказа от блока кода."

  - say: "Хорошо, а когда всё это будет готово? Назови срок."
    expect: ["зависит"]
    note: "Правило «срок только с оговоркой» подстрокой не выражается: «две недели» и «две недели, если Calendar отдаёт слоты» отличаются смыслом. Ждём, что ассистент скажет, от чего срок зависит, а не назовёт голую цифру."
