name: "День 25 — мини-чат с RAG и памятью задачи: выбрать стратегию контекста"
description: |
  Второй длинный разговор, двенадцать реплик. Цель — выбрать самую
  дешёвую стратегию контекста, которая не теряет ранние факты;
  ограничение — деньги важнее токенов; термин — «ранние факты» это
  имя, бюджет и сроки из первых реплик. Дальше — вопросы по заметкам
  дней 9–11, в том числе с отсылками («а sliding window?»), и две
  проверки, что цель и термин не потерялись.

  Варианты и устройство — как в первом сценарии: окно из четырёх
  сообщений, без памяти задачи и с ней.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  context: window
  keep_last: 4
  rag: "on"
  rag_candidates: 10
  rag_rerank: true
  rag_min_rerank: 0.1
  rag_rewrite: true
  rag_cite: true
  rag_expand: true
  system: |
    Ты ассистент учебного стенда advent — проекта на Go для экспериментов
    с LLM по REST API, который ведётся по дням курса. Помогаешь
    пользователю довести его задачу до конца. Отвечай по-русски, коротко:
    два-четыре предложения, с числами, если они есть.

variants:
  - name: окно 4

  - name: окно 4 + память задачи
    memory: auto
    task: kb-25-context

dialog:
  - say: "Выбираю стратегию контекста для длинного разговора в своём ассистенте. Цель — самая дешёвая стратегия, которая не теряет ранние факты. Ограничение: деньги важнее токенов. Под «ранними фактами» я имею в виду имя, бюджет и сроки из первых реплик. С чего начать: что показало сжатие истории через summary?"
    expect: ["21335"]
    sources: [docs/days/day09.md]
    cited: true
    note: "Цель, ограничение и термин названы здесь и больше не повторяются."

  - say: "А sliding window?"
    sources: [docs/days/day10.md]
    cited: true
    note: "Отсылка: без прошлой реплики вопрос непонятен. Rewrite раскрывает её через историю."

  - say: "Во сколько обходятся sticky facts?"
    sources: [docs/days/day10.md]
    cited: true

  - say: "Какая стратегия там оказалась самой дешёвой в деньгах?"
    expect: ["ветк"]
    sources: [docs/days/day10.md]
    cited: true

  - say: "А что дали слои памяти из одиннадцатого дня по деньгам?"
    expect: ["0.00247", "0.00267"]
    sources: [docs/days/day11.md]
    cited: true

  - say: "Сколько стоила сама раскладка по слоям?"
    expect: ["11531"]
    sources: [docs/days/day11.md]
    cited: true

  - say: "Есть ли у слоёв проблема с кэшем?"
    expect: ["26"]
    sources: [docs/days/day11.md]
    cited: true

  - say: "Напомни мою цель и что я назвал ранними фактами."
    expect: ["бюджет", "срок"]
    no_sources: true
    note: "Главная проверка. Первая реплика вне окна: цель и термин — только в памяти задачи."

  - say: "Учитывая моё ограничение — насколько кэш меняет картину?"
    grounded: true
    note: "Нужно ограничение «деньги важнее токенов» из памяти и данные о кэше из базы."

  - say: "Помнят ли слои ранние факты после обрыва разговора?"
    sources: [docs/days/day11.md]
    cited: true

  - say: "Спасибо, это полезно."
    no_sources: true
    note: "Благодарность — искать в базе нечего."

  - say: "Итог: какую стратегию выбрать под мою цель и ограничение? Коротко и с опорой на замеры."
    expect: ["сло"]
    note: "Итог должен держаться за цель (дёшево и без потери ранних фактов) и ограничение (деньги важнее токенов): по замерам дня 11 это слои с коротким окном. Чисел не требуем: итог — вопрос о разговоре, в базе по нему не ищут, а ранние ответы с числами уже вне окна."
