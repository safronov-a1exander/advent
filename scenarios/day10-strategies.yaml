# День 10 — три стратегии контекста на одном разговоре.
#
#   go run ./cmd/advent dialog -scenario scenarios/day10-strategies.yaml
#
# Собираем ТЗ на бота: в первых репликах заказчик называет бюджет, срок,
# стек и правила, потом разговор уходит в детали, потом — проверки на память.
# Дальше разговор разветвляется на два плана — MVP и полную версию — с разными
# сроками и составом, и в конце возвращается к MVP.
#
# Варианты:
#   - sliding window — в запрос уходят только последние сообщения;
#   - sticky facts   — блок фактов, обновляемый после каждой реплики, + хвост;
#   - branching      — полная история и настоящие ветки от чекпойнта.
#
# Команды веток (checkpoint / branch / switch) выполняет только вариант
# с branches: true. Остальные проходят те же реплики одной лентой — и оба
# плана смешиваются у них в одном разговоре. Так видно, что ветки дают.

name: day10 — sliding window, sticky facts, branching
description: >-
  Сбор ТЗ на Telegram-бота: 15 реплик, пять проверок на память, чекпойнт
  и две ветки плана. Три стратегии контекста проходят один и тот же разговор.

defaults:
  tier: weak
  system: >-
    Ты бизнес-аналитик и помогаешь собрать техническое задание. Отвечай
    по-русски, по делу, четыре-шесть предложений или короткий список.
    Опирайся на то, что заказчик уже сказал, и не выдумывай новых требований.
    Суммы — в рублях без разделителей разрядов.
  temperature: 0
  thinking: disabled
  max_tokens: 600

variants:
  - name: sliding window
    context: window
    keep_last: 4

  - name: sticky facts
    context: facts
    keep_last: 4

  - name: branching
    branches: true

dialog:
  # --- требования заказчика ---
  - say: Собираем ТЗ на Telegram-бота для записи в барбершоп «Бритва». Заказчик — Олег, у него две точки в Казани.
  - say: Бюджет 150000 рублей, запуск к 1 ноября. Бэкенд только на Go, база PostgreSQL.
  - say: Клиент выбирает мастера, услугу и время. Свободные слоты берём из Google Calendar мастеров.
  - say: Напоминание клиенту за 2 часа до визита обязательно. Отменить запись можно не позже чем за 3 часа.

  # --- детали: разговор растёт ---
  - say: Какие роли пользователей нужны в таком боте?
  - say: Какие команды и экраны бота предложишь клиенту?
  - say: Что должно быть в админке для владельца?
  - say: Какие риски у интеграции с календарём и как их снизить?

  # --- проверки на память о начале ---
  - say: Напомни бюджет, дату запуска и откуда берём свободные слоты.
    expect: ["150000", "1 ноября", "Google"]
    note: три факта из второй и третьей реплик
  - say: За сколько напоминаем о визите и до какого момента можно отменить запись?
    expect: ["2 час", "3 час"]
    note: два правила из четвёртой реплики

  # --- развилка: два плана от одной точки ---
  - checkpoint: развилка

  - branch: MVP
    from: развилка
  - say: Вариант MVP — без онлайн-оплаты, только одна точка, срок разработки 4 недели. Распиши этапы по неделям.
  - say: Какой срок разработки в текущем плане и есть ли онлайн-оплата?
    expect: ["4 недел"]
    note: вопрос внутри ветки MVP

  - branch: полная версия
    from: развилка
  - say: Вариант полной версии — онлайн-оплата через ЮKassa, обе точки, срок разработки 8 недель. Распиши этапы.
  - say: Какой срок разработки в текущем плане и через что принимаем оплату?
    expect: ["8 недел", "ЮKass"]
    note: вопрос внутри ветки полной версии

  # --- возврат к MVP ---
  - switch: MVP
  - say: Возвращаемся к MVP. Собери итоговое ТЗ одним списком — заказчик, бюджет, стек, источник слотов, срок разработки.
    expect: ["Олег", "150000", "Go", "Google", "4 недел"]
    note: ранние факты плюс срок именно MVP — без веток оба плана смешаны в одной ленте
