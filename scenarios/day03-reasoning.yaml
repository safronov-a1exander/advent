name: day03-reasoning
title: расчёт остатка бюджета
description: >-
  Сквозной проект «Бюджет»: считаем остаток месячного бюджета по той же
  выписке, что разбирали на прошлом шаге. У задачи единственный правильный
  ответ (38865), поэтому «какой способ рассуждения точнее» проверяется автоматом,
  а не на глаз. Каждый способ прогоняется дважды: важна и правильность,
  и стабильность.

repeat: 2

system: >-
  Ты ассистент по личным финансам. Последней строкой выведи ровно
  «ОТВЕТ: <число>» — без пробелов, разделителей разрядов и знака рубля.

params:
  temperature: 0.2
  max_tokens: 1500
  # Встроенные рассуждения отключены намеренно, по двум причинам.
  # Во-первых, они съедают весь max_tokens: замер на живом API —
  # 2000 из 2000 completion-токенов ушли в reasoning, до ответа
  # генерация не дошла. Во-вторых, день ровно про то, как способ
  # промпта заставляет модель рассуждать: встроенный reasoning
  # смазал бы разницу между вариантами.
  thinking: disabled

vars_files:
  statement: data/statement.txt

vars:
  rules: |
    Правила подсчёта:
    — считаем только операции сентября;
    — перевод на собственный накопительный счёт тратой не считается;
    — снятие наличных считается тратой;
    — возвраты (отрицательные суммы) уменьшают траты;
    — операции в долларах пересчитываются по курсу 90 рублей за доллар.

# Проверка: сентябрьские плюсовые операции 23415 ₽ (включая 5000 ₽ наличными
# и 900 ₽ за Spotify по курсу 90) минус возвраты 2280 ₽ = 21135 ₽ трат.
# Не в счёт: перевод на копилку 10000 ₽ и августовский Ozon 1990 ₽.
# Остаток: 60000 − 21135 = 38865 ₽.
checks:
  must_contain: ["38865"]

variants:
  - id: direct
    label: "1. прямой ответ"
    note: >-
      Без единой подсказки, как думать. Модель отвечает первым, что
      «похоже на ответ». В выписке четыре ловушки сразу — августовская
      операция, перевод на копилку, снятие наличных и доллары, — и хотя бы
      одну прямой ответ обычно теряет.
    steps:
      - user: |
          Бюджет на месяц — 60000 рублей. Сколько от него осталось?

          {{.rules}}

          Выписка:
          {{.statement}}

  - id: cot
    label: "2. решай пошагово"
    note: >-
      Единственное отличие от варианта 1 — просьба рассуждать вслух.
      Промежуточные суммы попадают в контекст, и модель опирается на них,
      а не угадывает финальное число сразу.
    steps:
      - user: |
          Бюджет на месяц — 60000 рублей. Сколько от него осталось?

          {{.rules}}

          Решай пошагово: выпиши каждую операцию отдельной строкой с решением,
          учитывать её или нет, потом сумму трат, и только потом итог.

          Выписка:
          {{.statement}}

  - id: meta
    label: "3. модель пишет промпт"
    note: >-
      Два вызова. Сначала просим составить наилучший промпт для этой
      задачи, затем этим промптом её и решаем. Ответ первого шага
      подставляется во второй через {{.generated}}.
    steps:
      - label: "шаг 1 — сгенерировать промпт"
        system: >-
          Ты инженер промптов. Твой ответ — только текст промпта,
          без пояснений и без решения задачи.
        user: |
          Составь максимально эффективный промпт для точного подсчёта остатка
          месячного бюджета по банковской выписке.

          На вход исполнителю придут: сумма месячного бюджета и строки выписки.
          Ответ — сколько от бюджета осталось.

          Учти типовые ошибки: забывают вычесть траты из бюджета, берут
          операции не того месяца, внутренние переводы принимают за траты,
          возвраты складывают вместо вычитания, забывают пересчитать валюту,
          арифметику делают в уме. В промпт добавь требование выводить
          последней строкой «ОТВЕТ: <число>».

          Правила задачи:
          {{.rules}}
        capture: generated
      - label: "шаг 2 — решить по нему"
        user: |
          {{.generated}}

          Бюджет на месяц — 60000 рублей.

          Выписка:
          {{.statement}}

  - id: experts
    label: "4. группа экспертов"
    note: >-
      Четыре вызова. Аналитик классифицирует операции, инженер считает,
      критик ищет ошибку, синтезатор сводит. Каждый видит только результат
      предыдущих — это уже маленький мультиагентный конвейер.
    steps:
      - label: "аналитик"
        system: Ты аналитик. Классифицируешь операции, но ничего не считаешь.
        user: |
          Пройди по выписке и для каждой операции напиши, входит она в траты
          месяца или нет и почему. Итог не считай.

          {{.rules}}

          Выписка:
          {{.statement}}
        capture: analysis

      - label: "инженер"
        system: Ты инженер-расчётчик. Считаешь аккуратно и по шагам.
        user: |
          По этому разбору посчитай сумму трат, а затем остаток от бюджета
          в 60000 рублей. Каждое вычисление — отдельной строкой с числами.
          Итоговая величина — остаток.

          Разбор:
          {{.analysis}}
        capture: solution

      - label: "критик"
        system: Ты критик. Ищешь ошибки, а не хвалишь.
        user: |
          Проверь расчёт: все ли операции того месяца, не попал ли внутренний
          перевод в траты, учтено ли снятие наличных, пересчитана ли валюта,
          правильно ли вычтены возвраты, сходится ли арифметика. Нашёл ошибку — назови её
          и приведи верное вычисление.

          Расчёт:
          {{.solution}}

          {{.rules}}

          Выписка:
          {{.statement}}
        capture: critique

      - label: "синтез"
        user: |
          Вопрос: бюджет на месяц — 60000 рублей, сколько от него осталось?

          Сведи расчёт и замечания в финальный ответ. Если критик нашёл
          ошибку — считай верным его вариант. Отвечай именно на вопрос:
          нужен остаток бюджета, а не сумма трат.

          Расчёт инженера:
          {{.solution}}

          Замечания критика:
          {{.critique}}
