name: "День 22 — первый RAG-запрос: десять контрольных вопросов"
description: |
  Десять вопросов о стенде — о том, что намерено и найдено за двадцать
  дней. Модель этих документов никогда не видела: ответ есть только
  в базе знаний (заметки дней, README, ранбук, код серверов).

  Два варианта одной модели. «Без RAG» отвечает тем, что знает сама.
  «С RAG» перед ответом ищет три ближайших фрагмента базы и отправляет
  их вместе с вопросом.

  У каждого вопроса записано ожидание — что должно быть в ответе (expect,
  это числа и термины из документа) и откуда (sources: файл, из которого
  должен прийти фрагмент). Источник проверяется только у варианта с RAG:
  варианту без базы искать негде, его сравнивают по ответу.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты ассистент учебного стенда advent — проекта на Go для экспериментов
    с LLM по REST API, который ведётся по дням курса. Отвечай по-русски,
    коротко: два-четыре предложения, с числами, если они есть.

variants:
  - name: без RAG

  - name: с RAG
    rag: "on"

dialog:
  - say: "Сколько токенов ушло на разговор из пяти ходов, когда считали токены по ходам, и сколько из них пришло из кэша провайдера?"
    expect: ["8694", "5376"]
    sources: [docs/days/day08.md]
    note: "Ожидание: 8694 токена на пять ходов, 5376 из 6570 входных — из кэша DeepSeek. Источник — заметка дня 8."

  - say: "Какую ошибку внесла сводка, когда историю разговора сжимали через summary?"
    expect: ["21335", "21135"]
    sources: [docs/days/day09.md]
    note: "Ожидание: сводка сама пересчитала остаток и записала 21335 вместо 21135. Источник — день 9."

  - say: "Во сколько токенов обошлась служебная раскладка реплик по слоям памяти по сравнению с самим разговором?"
    expect: ["11531", "11772"]
    sources: [docs/days/day11.md]
    note: "Ожидание: 11 531 служебных токенов против 11 772 «полезных» — половина входа. Источник — день 11."

  - say: "Почему ассистент без профиля пользователя оказался самым дорогим?"
    expect: ["6628", "1677"]
    sources: [docs/days/day12.md]
    note: "Ожидание: без профиля модель пишет статью — 6 628 токенов выхода против 1 677 у продакта. Источник — день 12."

  - say: "Что произошло, когда пользователь попросил считать задачу закрытой сразу, без проверки?"
    expect: ["execution"]
    sources: [docs/days/day13.md]
    note: "Ожидание: задача осталась в execution — переход execution → done запрещён кодом. Источник — день 13."

  - say: "Сколько стоит вести стадии задачи по сравнению с разговором без них?"
    expect: ["0.0046", "0.0024"]
    sources: [docs/days/day15.md]
    note: "Ожидание: 0.0046 против 0.0024 — примерно вдвое, весь расход на продвижение задачи. Источник — день 15."

  - say: "Почему курс турецкой лиры из таблицы ЦБ нельзя брать как есть?"
    expect: ["10"]
    sources: [docs/days/day17.md]
    note: "Ожидание: ЦБ публикует курс лиры за 10 единиц (номинал), сырой курс — ошибка в десять раз. Источник — день 17."

  - say: "Сколько токенов стоит схема двух инструментов на запросе, где ни один не вызван?"
    expect: ["63", "621"]
    sources: [docs/days/day17.md]
    note: "Ожидание: приветствие — 63 токена без MCP против 621 с MCP, около 560 на запрос. Источник — день 17."

  - say: "Почему каждая сводка по расписанию стоит одинаково?"
    expect: ["4215"]
    sources: [docs/days/day18.md]
    note: "Ожидание: вход 4 215 токенов каждый раз — агент новый, история не растёт, замеры приходят агрегатом. Источник — день 18."

  - say: "Насколько вырос вход, когда к трём своим серверам подключили два чужих, и почему в деньгах разница почти исчезла?"
    expect: ["37", "52", "кэш"]
    sources: [docs/days/day20.md]
    note: "Ожидание: вход на 37–52% больше при тех же вызовах, но схема почти целиком приходит из кэша. Источник — день 20."
