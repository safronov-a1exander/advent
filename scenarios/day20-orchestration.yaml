name: "День 20 — оркестрация MCP: три сервера, один флоу"
description: |
  Три своих MCP-сервера, у каждого своя область, и ни один ничего не знает
  о других: «Курсы» пересчитывают валюту, «Бюджет» знает выписку, «Цели»
  хранят накопления — и только в рублях. Ответ на вопрос «успею ли накопить
  на поездку» не лежит ни в одном из них: его может собрать только агент,
  выбирая инструменты и передавая данные с сервера на сервер.

  Проверяется маршрут, а не слова: какие инструменты с каких серверов
  вызваны, в каком порядке внутри каждой цепочки, и дошли ли числа
  с одного сервера до аргументов другого (стык «курс → цель»).

  Второй вариант — те же три сервера плюс два чужих публичных
  (deepwiki и context7), к задаче не относящихся. Он отвечает на два
  вопроса: не собьётся ли агент с маршрута, когда инструментов вдвое
  больше, и сколько стоит схема, которую платят в каждом запросе.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты ассистент по личным финансам. Отвечай по-русски, коротко и по делу.
    Цифры бери только из инструментов, в уме не пересчитывай.

variants:
  - name: три сервера
    mcp: [rates, budget, goals]

  - name: плюс два чужих
    mcp: [rates, budget, goals, deepwiki, context7]

dialog:
  - say: "Хочу к 1 марта 2027 года накопить на поездку в Стамбул — нужно 60 000 турецких лир. Сколько это в рублях по курсу ЦБ? Посмотри в выписке, сколько я откладываю на накопительный счёт, заведи цель, посчитай, успеваю ли при таком темпе, и сохрани план отчётом."
    chains:
      - [rates.convert, goals.add_goal, goals.plan_goal, budget.save_report]
      - [budget.search_transactions, budget.summarize_transactions, goals.plan_goal]
    passes:
      - {from: rates.convert, to: goals.add_goal}
    uses_result: true
    note: "Длинный флоу через три сервера. Цель в рублях — значит, сначала «Курсы», потом «Цели»; темп — из «Бюджета»; план — только когда есть и цель, и темп; отчёт — последним. Стык проверяет, что в цель легли рубли из курса, а не лиры из вопроса."

  - say: "А если откладывать по 25 000 в месяц? Обнови план в отчёте."
    chains:
      - [goals.plan_goal, budget.save_report]
    note: "Короткий флоу по уже заведённой цели: курс и выписка второй раз не нужны."

  - say: "Сколько сейчас стоит 1000 лир в рублях и какие у меня есть цели?"
    chains:
      - [rates.convert]
      - [goals.list_goals]
    uses_result: true
    note: "Два независимых вопроса к двум серверам в одной реплике: маршрутизация без цепочки."

  - say: "Спасибо, пока всё."
    no_tools: true
