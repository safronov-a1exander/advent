name: "День 12 — один запрос, разные профили"
description: |
  Четыре агента получают одни и те же пять вопросов. Отличаются только
  профилем: у первого его нет вовсе, у остальных — джуниор, сеньор
  и продакт из каталога `profiles/`.

  Системный промпт у всех один и тот же и намеренно никакой: «ты
  ассистент по разработке». Вся разница в ответах — это и есть то,
  что даёт профиль.

  Проверки разные по построению. Джуниору код нужен — ждём его. Продакту
  код запрещён профилем — ждём, что его не будет. Сеньору запрещены
  предисловия — ждём, что ответ начнётся с дела. Поэтому у реплик есть
  `expect_by`: общая проверка для всех и своя для каждого профиля.

  Последний вопрос — про инцидент. У сеньора на такие запросы своя дорога:
  другие стадии, пошаговая стратегия и сильная модель. Профиль — это не
  только тон, это ещё и то, каким путём пойдёт запрос.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: Ты ассистент по разработке. Отвечай по-русски.

variants:
  - name: без профиля
  - name: джуниор
    profile: джуниор
  - name: сеньор
    profile: сеньор
  - name: продакт
    profile: продакт

dialog:
  - say: "Объясни, что такое dependency injection."
    expect: ["зависимост"]
    forbid: ["отличный вопрос"]
    expect_by:
      джуниор:
        expect: ["func "]
      продакт:
        forbid: ["func ", "package ", "```go"]
    note: "Слайд из лекции: один запрос, три разных ответа. Джуниору нужен пример кода, продакту он запрещён профилем."

  - say: "Нам нужно кэшировать ответы внешнего API. Что взять?"
    expect_by:
      сеньор:
        forbid: ["отличный вопрос", "давайте разберёмся"]
      джуниор:
        forbid: ["вариант 2", "вариант 3"]
      продакт:
        forbid: ["func ", "```go"]
    note: "Ограничения профилей: сеньору — без предисловий, джуниору — один вариант, а не три, продакту — без кода."

  - say: "Что такое идемпотентность и зачем она в API?"
    expect: ["идемпотент"]
    expect_by:
      продакт:
        forbid: ["func ", "```go"]
    note: "Определение термина. Видно разницу в длине и в уровне: кому расшифровывать термины, а кому нет."

  - say: "Стоит ли переписать модуль оплаты на новую библиотеку?"
    expect_by:
      продакт:
        expect: ["срок"]
      сеньор:
        forbid: ["отличный вопрос"]
    note: "Вопрос решения. Продакт просил каждый срок с оговоркой — смотрим, вспомнит ли ассистент про сроки сам."

  - say: "У нас в проде таймауты на платежах последние два часа."
    expect_by:
      сеньор:
        expect: ["гипотез"]
      продакт:
        forbid: ["func ", "```go"]
    note: "Дорога «разобрать инцидент» есть только у сеньора: свои стадии, пошаговая стратегия, сильная модель. У остальных — дорога по умолчанию."
