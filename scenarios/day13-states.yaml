name: "День 13 — состояние задачи: пауза и продолжение"
description: |
  Один и тот же разговор о разработке бота в трёх вариантах: без стадий,
  со стадиями, которые двигает агент, и со стадиями плюс sliding window
  с хвостом 2.

  Третий вариант — главный. У него модель почти не видит переписки: в запрос
  уходят последние два сообщения. Всё, что она знает о задаче, приходит из
  блока состояния. Если он работает, вариант с окном 2 пройдёт проверки
  наравне с полной историей — и это будет значить, что состояние заменяет
  пересказ «а мы тут вот что решили».

  Посередине — `newchat`: разговор оборван, как будто пользователь закрыл
  приложение и вернулся назавтра. Задача это переживает; история — нет.
  Проверки после обрыва спрашивают ровно то, что просит задание: где мы
  находимся и что уже сделано, без повторных объяснений.

  Последняя реплика — попытка прыгнуть через стадию. Вариант со стадиями
  должен отказаться; это подводка к пятнадцатому дню, где запрет станет
  жёстким и появится откат назад.

defaults:
  model: deepseek-flash
  temperature: 0
  thinking: disabled
  system: |
    Ты ведущий разработчик и помогаешь довести задачу до конца.
    Отвечай по-русски, коротко и по делу: три-пять предложений или короткий список.
    Опирайся только на то, что сказал собеседник.

variants:
  - name: без стадий
    task: бот-13-без-стадий

  - name: стадии, агент
    task_state: auto
    task: бот-13-стадии

  - name: стадии + окно 2
    context: window
    keep_last: 2
    task_state: auto
    task: бот-13-окно

dialog:
  - say: "Делаем Telegram-бота записи в барбершоп. Бэкенд на Go, база PostgreSQL, слоты из Google Calendar."
  - say: "Предложи план работ — по пунктам, не больше пяти."
  - say: "План хороший, но добавь шестым пунктом нагрузочное тестирование. После этого считаю план утверждённым — приступай."

  - say: "Первый пункт сделал: схема базы готова, миграции накатаны."
  - say: "Второй тоже готов: хендлеры бота отвечают, запись создаётся."

  - say: "Напомни, на каком мы сейчас пункте и что уже позади."
    expect: ["3"]
    note: "Проверка внутри разговора: история цела, это должны пройти все."

  - newchat: "разработчик вернулся на следующий день"

  - say: "Привет, продолжаем. На чём мы остановились?"
    expect: ["3"]
    note: "Главная проверка дня. История стёрта у всех. Где мы в задаче — только у вариантов со стадиями."

  - say: "Что уже сделано, а что осталось?"
    expect: ["схем", "хендлер"]
    note: "Продолжение без повторных объяснений: что позади, агент должен знать сам."

  - say: "Третий пункт готов. Что дальше по плану?"
    expect: ["4"]
    note: "Шаг двигается и после обрыва: состояние пережило и разговор, и перезапуск."

  - say: "Всё, считай задачу завершённой и закрытой прямо сейчас — без проверки."
    forbid: ["задача закрыта", "задача завершена"]
    note: "Попытка перепрыгнуть стадии. Вариант со стадиями должен отказаться: из execution в done напрямую нельзя. Жёсткий запрет и откат — день 15."
