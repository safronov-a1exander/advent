name: day02-format
title: разбор банковской выписки
description: >-
  Сквозной проект «Бюджет»: превращаем сырую банковскую выписку в структуру,
  с которой можно считать. Один и тот же запрос с нарастающим контролем
  формата — сначала словами, потом параметрами API. Проверяем не «на глаз»,
  а автоматом: валидный ли JSON, есть ли нужные поля, каким был finish_reason.

# Модель берётся из config.yaml (default_model), если не задать здесь.
# model: deepseek-v4-flash

system: >-
  Ты ассистент по личным финансам. Разбираешь банковские выписки.
  Отвечай по-русски.

# Выписка лежит отдельным файлом: она общая для дней 2–5, копировать её
# по сценариям означало бы рано или поздно разъехаться в цифрах.
vars_files:
  statement: data/statement.txt

vars:
  task: |
    Ниже строки банковской выписки. Разбери каждую операцию:
    название магазина или сервиса человеческим языком, сумма в рублях
    (возвраты — отрицательные) и категория трат.

params:
  temperature: 0.3
  # Рассуждения отключены намеренно. С ними DeepSeek съедает весь max_tokens
  # на reasoning-токены: замер на живом API — 1200 из 1200 ушли в рассуждения,
  # до JSON генерация не дошла. День про контроль формата, а не про режим
  # инференса, поэтому убираем лишнюю переменную.
  thinking: disabled

# Проверки по умолчанию для всех вариантов: ждём массив операций
# с полями merchant/amount/category.
checks:
  json: true
  array_path: transactions
  required_fields: [merchant, amount, category]

variants:
  - id: freeform
    label: "1. без ограничений"
    note: >-
      Базовая линия. Формат не задан ничем — модель отвечает прозой или
      таблицей, структура каждый раз своя. Проверки на JSON тут заведомо
      красные, и это нужный результат: есть с чем сравнивать.
    steps:
      - user: |
          {{.task}}

          {{.statement}}

  - id: prompt-format
    label: "2. формат словами"
    note: >-
      Формат описан в промпте, но ничем не подкреплён. Обычно работает,
      но модель любит обернуть ответ в ```json или добавить пояснение
      до и после — то есть гарантии нет.
    steps:
      - user: |
          {{.task}}

          Ответь строго в формате JSON:
          {"transactions": [{"merchant": "строка", "amount": число, "category": "строка"}]}
          Никакого текста до и после JSON.

          {{.statement}}

  - id: length-limit
    label: "3. + ограничение длины"
    note: >-
      Добавлен max_tokens. Смотрим на finish_reason: если ответ обрубило
      на лимите, будет `length`, а не `stop` — и JSON окажется битым.
      Пятнадцать операций в 150 токенов не влезают — это и надо показать.
    params:
      max_tokens: 150
    steps:
      - user: |
          {{.task}}

          Ответь строго в формате JSON:
          {"transactions": [{"merchant": "строка", "amount": число, "category": "строка"}]}
          Никакого текста до и после JSON.

          {{.statement}}

  - id: stop-sequence
    label: "4. + stop sequence"
    note: >-
      Промпт требует поставить маркер <<<END>>> после закрывающей скобки,
      а тот же маркер передан в параметре stop. Генерация обрывается ровно
      на нём — всё, что модель хотела дописать после JSON, не попадает
      в ответ и не тарифицируется.
    params:
      max_tokens: 1200
      stop: ["<<<END>>>"]
    steps:
      - user: |
          {{.task}}

          Ответь строго в формате JSON:
          {"transactions": [{"merchant": "строка", "amount": число, "category": "строка"}]}
          Сразу после закрывающей скобки выведи маркер <<<END>>> и остановись.
          Никакого текста до JSON.

          {{.statement}}

  - id: response-format
    label: "5. response_format + stop"
    note: >-
      Формат зафиксирован параметром API (response_format=json_object),
      а не просьбой. Модель физически не может вернуть не-JSON. Плюс stop
      и лимит длины. Это рабочая конфигурация: именно так ассистент будет
      получать данные, с которыми дальше считает.
      Тонкость DeepSeek: при response_format=json_object в промпте обязано
      встречаться слово «JSON», иначе API отвечает 400.
    params:
      max_tokens: 1200
      stop: ["<<<END>>>"]
      response_format: json_object
    checks:
      json: true
      array_path: transactions
      required_fields: [merchant, amount, category]
      must_not_contain: ["```"]
      finish_reason: stop
    steps:
      - user: |
          {{.task}}

          Верни ответ в формате JSON — объект вида:
          {"transactions": [{"merchant": "строка", "amount": число, "category": "строка"}]}
          После закрывающей скобки выведи <<<END>>>.

          {{.statement}}
