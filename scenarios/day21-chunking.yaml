name: "День 21 — две стратегии нарезки на одних вопросах"
description: |
  Эталонные вопросы к базе знаний стенда: где в документах лежит ответ.
  Вопросы сформулированы своими словами, а не цитатой — иначе поиск
  находил бы совпадение слов, а не смысл.

  Попадание — чанк из нужного файла, в котором есть факт целиком (все
  подстроки expect). Проверяется текст, а не метаданные: у fixed-чанка
  в метаданных раздел, на котором он начался, а факт мог уехать в хвост.
  «Порван» — такого чанка в индексе нет вовсе: нарезка разрезала факт,
  и целиком его не достанет никакой поиск.

k: 5

probes:
  - q: "Почему вариант с рассуждениями не выдал JSON во втором дне?"
    source: docs/days/day02.md
    expect: ["1200 из 1200", "finish_reason: length"]

  - q: "Что ответит API, если попросить json_object, но не упомянуть JSON в промпте?"
    source: docs/days/day02.md
    expect: ["Prompt must contain the word 'json'"]

  - q: "Насколько похожи ответы при нулевой температуре?"
    source: docs/days/day04.md
    expect: ["0.38"]

  - q: "Какая доля входных токенов пришла из кэша DeepSeek в разговоре из пяти ходов?"
    source: docs/days/day08.md
    expect: ["5376 из 6570"]

  - q: "Какую ошибку в остатке внесла сводка при сжатии истории?"
    source: docs/days/day09.md
    expect: ["21335 вместо 21135"]

  - q: "Во сколько обходится служебная раскладка реплик по слоям памяти?"
    source: docs/days/day11.md
    expect: ["11 531", "11 772"]

  - q: "Почему ассистент без профиля пользователя оказался самым дорогим?"
    source: docs/days/day12.md
    expect: ["6 628", "1 677"]

  - q: "Что случилось, когда пользователь попросил закрыть задачу сразу, без проверки?"
    source: docs/days/day13.md
    expect: ["execution → done"]

  - q: "Сколько стоят стадии задачи по сравнению с разговором без них?"
    source: docs/days/day15.md
    expect: ["0.0046 против 0.0024"]

  - q: "Почему курс турецкой лиры из таблицы ЦБ нельзя брать как есть?"
    source: docs/days/day17.md
    expect: ["за 10 единиц", "ошибка в десять раз"]

  - q: "Сколько кругов вызовов инструментов разрешено агенту за один ход?"
    source: docs/days/day17.md
    expect: ["Восемь кругов"]

  - q: "Во сколько токенов обходится схема инструментов, когда ничего не вызвано?"
    source: docs/days/day17.md
    expect: ["63 токена", "621"]

  - q: "Почему все сводки по расписанию стоят одинаково?"
    source: docs/days/day18.md
    expect: ["4 215"]

  - q: "Где ломалась цепочка поиск → сводка → отчёт на живом API?"
    source: docs/days/day19.md
    expect: ["15 235 вместо 17 225"]

  - q: "Что сделает сервер бюджета, если отчёт с таким заголовком уже сохранён?"
    source: internal/servers/budget/server.go
    expect: ["O_EXCL", "%s-%d.md"]

  - q: "Как часто сервер слежения готов опрашивать курс рынка?"
    source: docs/days/day18.md
    expect: ["Не чаще раза в 10 секунд"]
