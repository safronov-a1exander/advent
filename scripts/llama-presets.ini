; Пресеты llama-server в режиме роутера (день 29): одна точка входа
; http://127.0.0.1:8080/v1, а модель выбирается полем model запроса.
; Имя секции = имя модели в API и в config.yaml.
;
; Квантовка и окно контекста — настройки сервера, а не запроса: их нельзя
; передать в /chat/completions. Роутер превращает их в имя модели, и стенд
; сравнивает их так же, как разные модели в дне 5.
;
; Пути — от каталога llama.cpp (scripts/local-llm.ps1 -Router запускает
; сервер оттуда). Запуск:
;   .\scripts\local-llm.ps1 -Router

version = 1

[*]
ngl = 99
jinja = true
parallel = 1

; Как в днях 26–28: 4-битная квантовка, окно 8192.
[qwen3-4b]
model = models/Qwen3-4B-Q4_K_M.gguf
c = 8192

; Те же веса в 8 бит: на 1.8 ГБ тяжелее — дают ли они точность?
[qwen3-4b-q8]
model = models/Qwen3-4B-Q8_0.gguf
c = 8192

; Окно под задачу: промпт с выпиской и шаблоном ~1200 токенов, ответ
; ~850 — 4096 хватает с запасом. KV-кэш в 8 бит вдвое легче f16;
; квантованный V-кэш требует flash attention.
[qwen3-4b-c4k]
model = models/Qwen3-4B-Q4_K_M.gguf
c = 4096
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0

; Окно меньше задачи: промпт влезает, ответ — нет. Показывает, где
; кончается экономия. (2048 впритык хватает: 1172 + 827 = 1999.)
[qwen3-4b-c1536]
model = models/Qwen3-4B-Q4_K_M.gguf
c = 1536
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
