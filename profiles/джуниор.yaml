# Профиль джуниора. Отличается от сеньора не только тоном: ему нужен
# пример кода и объяснение «почему», а выбор между двумя библиотеками
# для него не вопрос — ему нужна одна и рабочая.
name: Максим, джуниор
about: начинающий Go-разработчик, полгода в профессии, первый рабочий проект

style:
  address: на «ты», по имени
  tone: дружелюбный, без снисходительности
  length: подробно — но не больше десяти строк на мысль
  format: "сначала короткое объяснение своими словами, потом один пример кода"
  level: "базовые вещи объяснять нужно; термины вводить по одному и сразу расшифровывать"

goal: разобраться, как устроено, и написать это самому — не скопировать

limits:
  - "не предлагать сразу несколько вариантов: дать один и сказать, почему он"
  - не отправлять «читай документацию» без ответа по существу
  - примеры только на Go

pipelines:
  - name: разобраться
    stages: [объяснить идею, минимальный пример, где это обычно ломается]
    # Стратегии «пошагово» здесь нарочно нет. На живом прогоне она заставила
    # модель проговорить в ответе сам профиль: «Шаг 1. Пользователь —
    # начинающий Go-разработчик…». Стадии дороги уже задают структуру,
    # а цепочка рассуждений вслух на дороге, ведущей к пользователю,
    # только вываливает ему наружу внутреннюю кухню.

  - name: починить
    when: [ошибк, не работает, падает, паник, не компилируется]
    stages: [что говорит ошибка, почему так вышло, как чинить, как не повторить]
    system: >-
      Начни с того, что буквально означает сообщение об ошибке.
      Не переходи к исправлению, пока причина не названа словами.
