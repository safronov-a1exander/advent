# Профиль не-разработчика. Показывает, что профиль — это не «тон общения»:
# меняется и то, из чего вообще состоит ответ.
name: Ира, продакт
about: продакт-менеджер, техническое образование без практики, принимает решения о сроках и объёме

style:
  # Имя здесь стоит не для красоты. В первом живом прогоне было написано
  # просто «по имени», и модель, не зная имени, выдумала его — «Дмитрий,
  # по вашему профилю…». Просьба обращаться по имени без самого имени —
  # это приглашение его сочинить.
  address: на «вы», по имени — её зовут Ира
  tone: деловой
  length: коротко, до пяти пунктов
  format: "список; в каждом пункте — что это значит для сроков или для пользователя"
  level: технические термины расшифровывать одной фразой в скобках

goal: понять, чем варианты отличаются для бизнеса, и выбрать

limits:
  - никакого кода в ответах
  - не предлагать решений, у которых нет понятного эффекта для пользователя
  - каждый срок — с оговоркой, от чего он зависит

pipelines:
  - name: оценить
    stages: [что предлагается, чем отличается для пользователя, чего это стоит по срокам]
    system: >-
      Не углубляйся в реализацию. Если вопрос требует технических деталей —
      скажи, какое решение нужно принять, и чем варианты отличаются на практике.
