# Конфиг стенда. Секретов здесь нет и быть не должно.
# Ключ берётся из переменной окружения (api_key_env) либо из config.local.yaml,
# который лежит в .gitignore.

default_provider: deepseek
runs_dir: runs
reports_dir: reports
# Сохранённые разговоры агентов: по JSON-файлу на агента (день 7).
sessions_dir: sessions
# Профили пользователей: стиль, ограничения и дороги запросов (день 12).
# Это конфиг, а не данные, поэтому каталог лежит в репозитории.
profiles_dir: profiles
# Наборы инвариантов: чего ассистенту нельзя никогда (день 14).
# Конфиг проекта, а не пользователя, — лежит в репозитории.
invariants_dir: invariants
# Состояния задач: стадия, шаг, план (день 13). Отдельно от памяти:
# память отвечает «что мы выяснили», состояние — «где мы в задаче».
tasks_dir: tasks
# Слои памяти, переживающие разговор (день 11): memory/users/<юзер>.json
# и memory/tasks/<задача>.json. Краткосрочный слой сюда не попадает —
# он живёт в файле разговора.
memory_dir: memory

providers:
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    default_model: deepseek-flash
    # Прайс сверен с https://api-docs.deepseek.com/quick_start/pricing
    # (2026-09-13). deepseek-v4-flash и deepseek-v4-flash-vision-exp выведены:
    # старые имена API ещё принимает, но отвечает моделью deepseek-flash —
    # по её прайсу и считается стоимость.
    # У DeepSeek две ставки: пиковая и вдвое дешевле в непиковые часы
    # (пик — 01:00-04:00 и 06:00-10:00 UTC, пн-пт).
    # Здесь стоят ПИКОВЫЕ, чтобы колонка стоимости не занижала расход.
    # Список моделей проверяется командой `advent models`.
    models:
      - id: deepseek-flash
        label: Flash
        tier: weak
        in_per_1m: 0.3
        cached_in_per_1m: 0.006
        out_per_1m: 1.2
        max_context: 1000000
        reasoning: true
        url: https://api-docs.deepseek.com/quick_start/pricing
        description: дешёвая быстрая модель, дефолт для большинства заданий
      - id: deepseek-v4-pro
        label: Pro
        tier: strong
        in_per_1m: 1.32
        cached_in_per_1m: 0.044
        out_per_1m: 3.96
        max_context: 1000000
        reasoning: true
        url: https://api-docs.deepseek.com/quick_start/pricing
        description: сильная модель, для сравнения качества

  # Резервный провайдер: тот же код, другой base_url.
  # Пригодится в неделю про локальные модели (llama.cpp/vLLM отдают
  # OpenAI-совместимый эндпоинт) и если понадобится OpenRouter.
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    default_model: deepseek/deepseek-chat
    models: []

  # Локальная модель (день 26): llama.cpp на этой машине, поднимает
  # scripts/local-llm.ps1. Тот же /chat/completions, что у DeepSeek, —
  # код клиента не меняется, меняется base_url. Ключ llama-server
  # не проверяет, пока его не запустили с --api-key.
  - name: local
    base_url: http://127.0.0.1:8080/v1
    api_key_env: LOCAL_API_KEY
    api_key: local
    default_model: qwen3-4b
    # Qwen3 переключает рассуждения шаблоном чата, а не полем thinking.
    thinking_via: chat_template_kwargs
    models:
      - id: qwen3-4b
        label: Qwen3-4B Q4_K_M
        tier: weak
        params_b: 4
        quant: q4_k_m
        in_per_1m: 0
        cached_in_per_1m: 0
        out_per_1m: 0
        max_context: 8192   # окно, с которым поднят сервер (-c), а не предел модели
        reasoning: true
        url: https://huggingface.co/Qwen/Qwen3-4B-GGUF
        description: 4 млрд параметров, 4-битная квантовка, 2.5 ГБ — влезает в 8 ГБ видеопамяти
      - id: qwen3-4b-q8
        label: Qwen3-4B Q8_0
        tier: medium
        params_b: 4
        quant: q8_0
        in_per_1m: 0
        cached_in_per_1m: 0
        out_per_1m: 0
        max_context: 8192
        reasoning: true
        url: https://huggingface.co/Qwen/Qwen3-4B-GGUF
        description: те же веса в 8 бит, 4.3 ГБ — для сравнения квантований
      # Пресеты роутера (день 29, scripts/llama-presets.ini): те же веса
      # Q4_K_M, но другое окно и KV-кэш в 8 бит. Окно задаётся при загрузке
      # модели, поэтому каждая конфигурация сервера — своё имя модели.
      - id: qwen3-4b-c4k
        label: Q4_K_M · окно 4096 · KV q8_0
        tier: weak
        params_b: 4
        quant: q4_k_m
        in_per_1m: 0
        cached_in_per_1m: 0
        out_per_1m: 0
        max_context: 4096
        reasoning: true
        url: https://huggingface.co/Qwen/Qwen3-4B-GGUF
        description: окно под задачу — промпт с выпиской и ответ занимают ~2000 токенов
      - id: qwen3-4b-c1536
        label: Q4_K_M · окно 1536 · KV q8_0
        tier: weak
        params_b: 4
        quant: q4_k_m
        in_per_1m: 0
        cached_in_per_1m: 0
        out_per_1m: 0
        max_context: 1536
        reasoning: true
        url: https://huggingface.co/Qwen/Qwen3-4B-GGUF
        description: окно меньше задачи — ответ обрывается

  # Приватный сервис (день 30): та же Qwen3-4B, но через шлюз advent serve —
  # с ключом, лимитами и по сети. Здесь адрес для этой машины; адрес в
  # локальной сети (http://192.168.x.x:8095/v1) и ключ — в config.local.yaml
  # или ADVENT_PRIVATE_KEY: ключ выдаёт `advent serve -new-key <имя>`.
  - name: private
    base_url: http://127.0.0.1:8095/v1
    api_key_env: ADVENT_PRIVATE_KEY
    default_model: qwen3-4b
    thinking_via: chat_template_kwargs
    models:
      - id: qwen3-4b
        label: Qwen3-4B через шлюз
        tier: weak
        params_b: 4
        quant: q4_k_m
        in_per_1m: 0
        cached_in_per_1m: 0
        out_per_1m: 0
        max_context: 4096   # окно на запрос: -c 8192 на два слота (-np 2)
        reasoning: true
        url: https://huggingface.co/Qwen/Qwen3-4B-GGUF
        description: модель шлюз выбирает сам — поле model клиента не учитывается

  # Заглушка `go run ./tools/mockllm` — репетиция демо и запись видео
  # без траты токенов. Цены выдуманы, чтобы колонка стоимости была не пустой.
  - name: mock
    base_url: http://127.0.0.1:8099/v1
    api_key_env: MOCK_API_KEY
    api_key: mock
    default_model: mock-weak
    models:
      - id: mock-weak
        label: Mock Weak
        tier: weak
        params_b: 7
        quant: q4
        in_per_1m: 0.10
        cached_in_per_1m: 0.01
        out_per_1m: 0.20
        max_context: 32000
        url: http://127.0.0.1:8099/v1
      - id: mock-medium
        label: Mock Medium
        tier: medium
        params_b: 32
        quant: q8
        in_per_1m: 0.30
        cached_in_per_1m: 0.03
        out_per_1m: 0.90
        max_context: 64000
        url: http://127.0.0.1:8099/v1
      - id: mock-strong
        label: Mock Strong
        tier: strong
        params_b: 235
        quant: fp8
        in_per_1m: 0.60
        cached_in_per_1m: 0.06
        out_per_1m: 2.40
        max_context: 128000
        url: http://127.0.0.1:8099/v1

# MCP-серверы (день 16). Удалённые — по адресу (Streamable HTTP), локальные —
# командой запуска (stdio, день 17). "@self" — сам advent: свои серверы стенда
# живут в том же бинаре подкомандой mcp-server.
mcp_servers:
  - name: rates
    command: "@self"
    args: [mcp-server, rates]
    description: курсы валют ЦБ РФ — свой сервер стенда вокруг API ЦБ
  # Выписка по карте: поиск, сводка, сохранение отчёта (день 19).
  # Данные от search к summarize идут по ссылке — dataset_id.
  - name: budget
    command: "@self"
    args: [mcp-server, budget]
    description: выписка по карте — поиск, сводка, отчёт в файл
  # Тот же сервер, но операции идут к summarize целиком, через модель.
  # Нужен для сравнения: какой способ передачи данных надёжнее.
  - name: budget-byvalue
    command: "@self"
    args: [mcp-server, budget, -handoff, value]
    description: то же, но модель переписывает операции из search в summarize сама
  # Цели накоплений: сумма в рублях, срок, план (день 20). Знает только
  # рубли — пересчитывать валюту и смотреть выписку должен агент через
  # другие серверы.
  - name: goals
    command: "@self"
    args: [mcp-server, goals]
    description: цели накоплений — сумма, срок, успеваю ли
  # Репозиторий стенда (день 31): ветка, изменения, файлы, diff, история.
  # Только чтение — ассистенту разработчика коммитить и пушить незачем.
  - name: git
    command: "@self"
    args: [mcp-server, git]
    description: git-репозиторий проекта — ветка, статус, файлы, diff, лог
  # Тот же сервер курсов, но отдельным процессом по HTTP (день 18): ему нужно
  # жить и делать замеры, когда к нему никто не подключён. Запуск:
  #   advent mcp-server rates -http 127.0.0.1:8765
  - name: rates-live
    url: http://127.0.0.1:8765/mcp
    description: курсы и слежение по расписанию — долгоживущий сервер
  - name: deepwiki
    url: https://mcp.deepwiki.com/mcp
    description: документация GitHub-репозиториев от Devin
  - name: context7
    url: https://mcp.context7.com/mcp
    description: свежая документация библиотек
    # С ключом лимиты выше; без ключа тоже работает.
    headers:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
  - name: gitmcp
    url: https://gitmcp.io/docs
    description: документация любого GitHub-проекта; выдаёт сессию

# Модели эмбеддингов (день 21): текст → вектор. Отдельно от providers —
# у них свой эндпоинт /v1/embeddings, и чат-модели к ним отношения не имеют.
# Локальный сервер поднимает scripts/rag-servers.ps1 (llama.cpp на GPU);
# Ollama отдаёт тот же /v1/embeddings — достаточно поменять base_url и model.
embedders:
  - name: bge-m3
    base_url: http://127.0.0.1:8081/v1
    model: bge-m3
    batch: 8
    description: BAAI bge-m3, 1024 измерения, многоязычная — русский понимает
  # Заглушка `go run ./tools/mockllm`: векторы из хэшей слов. Смысла не
  # понимает, но одинаковые слова сближает — для репетиций хватает.
  - name: mock
    base_url: http://127.0.0.1:8099/v1
    model: mock-embed
    batch: 64
    description: заглушка — хэши слов вместо смысла

# Реранкеры (день 23): кросс-энкодер читает вопрос и фрагмент вместе и
# отвечает, насколько фрагмент отвечает на вопрос. Медленнее эмбеддинга —
# поэтому смотрит только на кандидатов первого этапа. Эндпоинт /v1/rerank
# в формате Jina/Cohere; llama.cpp поднимает scripts/rag-servers.ps1.
rerankers:
  - name: bge-reranker
    base_url: http://127.0.0.1:8082/v1
    model: bge-reranker-v2-m3
    logits: true   # llama.cpp отдаёт сырой логит, а не вероятность
    description: BAAI bge-reranker-v2-m3, многоязычный кросс-энкодер
  - name: mock
    base_url: http://127.0.0.1:8099/v1
    model: mock-rerank
    description: заглушка — доля общих слов вопроса и фрагмента

# База знаний (день 21): документы стенда, которых модель никогда не видела.
# Заметки дней 21+ в базу не входят — в них контрольные вопросы с ответами,
# и поиск находил бы шпаргалку вместо источника.
rag:
  embedder: bge-m3
  reranker: bge-reranker
  index_dir: index
  strategy: structure
  sources:
    include:
      - README.md
      - docs/RUNBOOK.md
      - docs/days/day0?.md
      - docs/days/day1?.md
      - docs/days/day20.md
      - internal/servers/**/*.go
    exclude:
      - "**/*_test.go"
  # Отдельные базы под задачу (день 31): свои источники, свой индекс
  # в index/<база>/. Собираются `advent index -base <имя>`, подключаются
  # к агенту флагом -kb. Нарезка и модели — общие, из этого же раздела.
  bases:
    # Ассистент разработчика: всё, что написано о самом стенде, — README,
    # ранбук, заметки всех дней (здесь контрольные вопросы не мешают:
    # с этой базой никто не меряет поиск), описание команд и конфига,
    # схемы инструментов своих MCP-серверов.
    project:
      include:
        - README.md
        - docs/RUNBOOK.md
        - docs/ARCHITECTURE.md
        - docs/days/*.md
        - config.yaml
        - cmd/advent/main.go
        - internal/servers/**/*.go
      exclude:
        - "**/*_test.go"
  chunking:
    size: 1200     # fixed: окно в символах
    overlap: 200   # fixed: перекрытие соседних окон
    max: 1800      # structure: раздел длиннее — делится по абзацам
    min: 250       # structure: кусок короче — склеивается со следующим
