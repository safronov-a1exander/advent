# Флот агентов для `advent swarm` (день 6).
#
# Десять агентов «Бюджета» в одном процессе: у каждой группы свой конфиг,
# у каждого агента своя история. Модель задана классом, а не именем —
# поэтому файл одинаково работает и на DeepSeek, и на заглушке mockllm:
#
#   go run ./cmd/advent swarm -fleet agents/fleet.yaml
#   go run ./cmd/advent swarm -fleet agents/fleet.yaml -provider mock

question: >-
  Бюджет на сентябрь 60000 рублей, потрачено 38865. Сколько осталось?
  Ответь одним числом без пояснений.
expect: "21135"

# Больше агентов — это только replicas; на живом API флот намеренно
# маленький, чтобы прогон стоил копейки. Масштаб до сотни проверяется
# юнит-тестом пула на фейковом провайдере.
parallel: 5

defaults:
  system: >-
    Ты ассистент по личным финансам. Отвечай по-русски, кратко и по делу.
    Суммы указывай в рублях без разделителей разрядов.
  tier: weak
  # Ответ — одно число: рассуждения тут только съели бы токены и время.
  thinking: disabled
  max_tokens: 40

agents:
  - name: точный
    temperature: 0
    replicas: 4

  - name: обычный
    temperature: 0.7
    replicas: 3

  - name: творческий
    temperature: 1.3
    replicas: 2

  - name: сильный
    tier: strong
    temperature: 0
    replicas: 1
